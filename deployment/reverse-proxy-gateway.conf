# File: /deployment/reverse-proxy-gateway.conf | Version: 0.1.0
map $remote_addr $duh_proxy_allowed {
    default 0;
    192.168.1.247 1;
}

log_format duh_gateway '$time_iso8601 $remote_addr $status $request_method';

server {
    listen 192.168.1.93:3210 default_server;
    server_name updatehub.ygsoft.fr;
    access_log /var/log/nginx/device-update-hub-access.log duh_gateway;

    if ($duh_proxy_allowed = 0) { return 403; }
    if ($host != updatehub.ygsoft.fr) { return 421; }
    if ($http_x_forwarded_proto != https) {
        return 308 https://updatehub.ygsoft.fr$request_uri;
    }

    client_max_body_size 0;
    client_body_timeout 86400s;
    send_timeout 86400s;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host updatehub.ygsoft.fr;
        proxy_set_header X-Forwarded-Host updatehub.ygsoft.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}